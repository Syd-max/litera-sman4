<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Buat Password Baru</title><link rel="icon" type="image/png" href="./assets/sman4-logo.png"><link rel="stylesheet" href="./css/base.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/auth.css"></head>
<body class="auth-page" data-page="update-password">
  <main class="auth-shell"><section class="auth-brand"><img src="./assets/sman4-logo.png" alt="Logo sekolah"><h1>SMART LIBRARY</h1><p>SMAN 4 TANGERANG SELATAN</p></section><section class="auth-card"><h2>Buat Password Baru</h2><p>Gunakan password yang kuat untuk akun Anda.</p>
    <form class="auth-form" data-update-form><div class="field"><label for="password">Password Baru</label><div class="field__control"><input id="password" name="password" type="password" autocomplete="new-password" data-password required><button class="password-toggle" type="button" data-password-toggle="password" aria-label="Tampilkan password"></button></div></div><div class="field"><label for="confirmation">Konfirmasi Password</label><div class="field__control"><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" data-password required><button class="password-toggle" type="button" data-password-toggle="confirmation" aria-label="Tampilkan password"></button></div><p class="field__hint">Minimal 8 karakter, huruf besar, huruf kecil, dan angka.</p></div><button class="button button--lime button--block" type="submit">Simpan Password</button></form>
    <div data-update-success hidden><div class="notice notice--success">Password berhasil diubah.</div><a class="button button--lime button--block" href="./index.html">Login Sekarang</a></div>
  </section></main><script src="./js/config/supabase-config.js"></script><script type="module" src="./js/pages/auth-pages.js"></script>
</body></html>
