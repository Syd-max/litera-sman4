<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Lupa Password</title><link rel="icon" type="image/png" href="./assets/sman4-logo.png"><link rel="stylesheet" href="./css/base.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/auth.css"></head>
<body class="auth-page forgot-page" data-page="forgot-password">
  <main class="forgot-shell">
    <a class="forgot-back" href="./index.html" aria-label="Kembali ke halaman login">←</a>
    <section class="forgot-brand"><img src="./assets/sman4-logo.png" alt="Logo SMAN 4 Tangerang Selatan"><h1>SMART LIBRARY</h1><p>SMAN 4 TANGERANG SELATAN</p></section>
    <section class="forgot-content"><h2>Lupa Password?</h2><p>Masukkan email yang terdaftar di akun Anda. Kami akan mengirimkan link untuk mereset password.</p>
      <form class="auth-form"><div class="field"><label for="email">Email terdaftar</label><div class="forgot-input"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg><input id="email" name="email" type="email" autocomplete="email" required placeholder="Masukkan email yang terdaftar"></div></div><button class="button button--lime button--block" type="submit">Kirim Link Reset</button></form>
      <div class="forgot-divider"><span>atau</span></div>
      <a class="button forgot-login" href="./index.html">Kembali ke Login</a>
      <div class="notice notice--success" data-reset-confirmation hidden><span>Link reset telah dikirim ke <strong></strong>. Periksa kotak masuk dan folder spam.</span></div>
    </section>
    <p class="forgot-help">Butuh bantuan? <a href="mailto:library@sman4.sch.id">Hubungi Admin</a></p>
  </main><script src="./js/config/supabase-config.js"></script><script type="module" src="./js/pages/auth-pages.js"></script>
